<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>&nbsp;</title>
  <style>
    :root {
      --bg: #1a1c20;
      --card: #24272e;
      --accent: #aab2c0;
      --accent-soft: #2a2e35;
      --text: #e8e6e3;
      --sub: #9a9a9a;
      --line: #3a3d44;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: "Noto Sans KR", "Hiragino Kaku Gothic ProN", "Meiryo", "Segoe UI", sans-serif;
      user-select: none;
    }
    #wrap {
      height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 14px;
      border: 1px solid var(--line);
    }
    #time {
      flex: 1; font-size: 26px; font-weight: 700; letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }
    #wrap.paused #time, #wrap.stopped #time { color: var(--sub); }
    button {
      padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--card); color: var(--text); font-size: .8rem; cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
    button:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <!-- 본 창 아래 붙는 타이머 창: 남은 시간 + 일시정지/계속 · 재시작 · 정지 -->
  <div id="wrap" class="stopped">
    <span id="time">00:00:00</span>
    <button type="button" id="toggleBtn">일시정지</button>
    <button type="button" id="restartBtn">재시작</button>
    <button type="button" id="stopBtn" title="정지: 설정한 시간으로 되돌림 · 정지 상태에서 한 번 더 누르면 타이머 끄기">정지</button>
  </div>
  <script src="timer.js"></script>
</body>
</html>
